
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fruit Master PRO</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="game-container">
    <header>
      <h1>🍉 Fruit Master PRO</h1>
      <div class="stats">
        <div>النقاط: <span id="score">0</span></div>
        <div>المستوى: <span id="level">1</span></div>
        <div>الوقت: <span id="timer">60</span></div>
        <div>الأرواح: <span id="lives">3</span></div>
      </div>
      <div class="progress">
        <div id="progress-bar"></div>
      </div>
    </header>

    <main>
      <canvas id="gameCanvas"></canvas>
      <div id="start-screen">
        <h2>🍓 جاهز للتحدي؟</h2>
        <p>اقطع الفواكه واجمع النقاط!</p>
        <button id="startButton">ابدأ اللعب</button>
      </div>
      <div id="game-over" hidden>
        <h2>انتهت اللعبة!</h2>
        <p>نتيجتك: <span id="final-score">0</span></p>
        <button id="restartButton">العب مرة أخرى</button>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
